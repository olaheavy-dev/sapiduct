# Generated by house-template-fastapi, then the project's: add its own dependencies here and run
# `make lock`. Template updates merge their changes in (copier update). The distribution is always
# "backend" and the import package always "app", so the file needs no per-project values and
# Dependabot can update it in the template directly.

[project]
name = "backend"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    # FastAPI 0.x minors can break, so stay on one minor and move deliberately.
    "fastapi[standard-no-fastapi-cloud-cli]>=0.162.0,<0.163",
    "alembic>=1.20.1",
    # LangChain 1.x; the provider packages are both installed so LLM_MODEL alone picks one.
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.7.0",
    "langchain-openai>=1.7.2",
    "langsmith>=0.14.12",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg-pool>=3.3.3",
    "boto3>=1.43.118",
    "fastmcp==4.1.3",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "webvtt-py>=0.6.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "import-linter>=2.15",
    "langsmith[pytest]>=0.14.12",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-recording>=0.14.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.2",
    "testcontainers[postgres]>=4.15.0",
    "types-boto3[s3]>=1.43.118",
    "types-pyyaml>=6.0.12",
    # 8.2 added httpx2, which the openai and anthropic SDKs use; 9.2 adds filter_sensitive_data.
    "vcrpy>=9.2.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.alembic]
# No alembic.ini: the database URL comes from app settings (migrations/env.py).
script_location = "migrations"
# %% because Alembic interpolates %(here)s-style values in this table.
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s"

# New revision files come out formatted, then lint-clean (format first, so long autogenerated
# lines don't show up as lint errors).
[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_fix"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[tool.ruff]
line-length = 100
src = ["src", "tests", "migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "C4", "SIM", "RUF", "PT", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is how pytest checks

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations"]

[tool.pytest]
testpaths = ["tests"]
# Evals call the real model, so only `make eval` selects them.
addopts = ["-q", "--strict-markers", "--strict-config", "-m", "not eval"]
markers = ["eval: calls the real model; run with make eval"]
xfail_strict = true
filterwarnings = ["error"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Only the model gateway talks to model providers"
type = "forbidden"
source_modules = ["app"]
# `langchain` too: init_chat_model would build a model that skips the budget. langchain_core
# (messages, prompts, runnables) is fine anywhere.
forbidden_modules = ["openai", "anthropic", "langchain", "langchain_openai", "langchain_anthropic"]
# The embeddings module calls OpenAI's SDK itself: LangChain's embeddings drop the usage the budget
# settles from.
ignore_imports = ["app.llm.** -> langchain", "app.llm.embeddings -> openai"]
